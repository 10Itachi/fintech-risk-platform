services:

  mysql:
    image: mysql:8.4
    container_name: gringotts-mysql

    ports:
      - "3307:3306"

    environment:
      MYSQL_ROOT_PASSWORD: Emma10watson*

    volumes:
      - ./data:/var/lib/mysql

    restart: unless-stopped

    networks:
      - mysql-net

networks:
  mysql-net:
    driver: bridge