server:
  port: 0

spring:
  application:
    name: transaction-event-ledger-service

  datasource:
    # 1. Added createDatabaseIfNotExist=true to handle the "Unknown Database" error
    url: jdbc:mysql://localhost:3306/gbank_transaction-event-ledger-service?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: Emma10watson*
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    # 2. Set to 'create' for the VERY FIRST run only.
    # After you see your tables in MySQL, change this to 'update'.
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # Cleaned up the dialect property (Spring Boot 3 uses MySQLDialect for 8+)
        dialect: org.hibernate.dialect.MySQLDialect

  kafka:

    topics:
      transaction-finalized: transaction.finalized.v1
      transaction-finalized-dlt: transaction.finalized.v1-dlt

    bootstrap-servers:
      - localhost:19092
      - localhost:19094
      - localhost:19096

    consumer:
      group-id: transaction-event-ledger-service
      auto-offset-reset: earliest
      enable-auto-commit: false

      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: com.gringotts.kafkaevents.TransactionFinalizedEvent
        spring.json.trusted.packages: com.gringotts.kafkaevents

    listener:
      concurrency: 3
      ack-mode: MANUAL
