spring:
  application:
    name: notification-service

  kafka:
    bootstrap-servers:
      - localhost:9092
      - localhost:9094
      - localhost:9096

    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      acks: all
      retries: 10 # attempts 10
      retry.backoff.ms: 1000  #10 attmpts with one sce interval

server:
  port: 0