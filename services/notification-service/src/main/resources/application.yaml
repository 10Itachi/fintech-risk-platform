spring:
  application:
    name: ${SPRING_APPLICATION_NAME}

  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO}

    show-sql: true

    properties:
      hibernate:
        format_sql: true
        dialect: ${HIBERNATE_DIALECT}

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}

  kafka:

    topics:
      transaction-finalized: ${KAFKA_TRANSACTION_FINALIZED_TOPIC}
      transaction-finalized-dlt: ${KAFKA_TRANSACTION_FINALIZED_DLT_TOPIC}

    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP}
      enable-auto-commit: false
      auto-offset-reset: ${KAFKA_AUTO_OFFSET_RESET}
      max-poll-records: ${KAFKA_MAX_POLL_RECORDS}

      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer

      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: com.gringotts.kafkaevents.TransactionFinalizedEvent
        spring.json.trusted.packages: com.gringotts.kafkaevents

    listener:
      ack-mode: manual

  output:
    ansi:
      enabled: ALWAYS

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus

logging:

  pattern:
    console: >
      %d{yyyy-MM-dd HH:mm:ss.SSS}
      [%X{correlationId}]
      %-5level
      %logger{36}
      - %msg%n

  level:

    com.gringotts: ${LOGGING_LEVEL_COM_GRINGOTTS}

    org.springframework.boot: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_BOOT}
    org.springframework.web: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB}
    org.springframework.security: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY}

    org.hibernate.SQL: ${LOGGING_LEVEL_ORG_HIBERNATE_SQL}

    org.springframework.kafka: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_KAFKA}

    com.zaxxer.hikari: ${LOGGING_LEVEL_COM_ZAXXER_HIKARI}

server:
  port: ${SERVER_PORT}